name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install MoonBit
        uses: moonbitlang/setup-moonbit@v0.1
      - name: Verify MoonBit toolchain
        run: |
          set -euxo pipefail
          command -v moon
          moon version
      - name: Check formatting
        run: moon fmt --check
      - name: Type check
        run: moon check
      - name: Run unit tests
        run: moon test
      - name: Run text report
        run: moon run cmd/main -- examples/access.log
      - name: Run JSON error filter
        run: moon run cmd/main -- --status-min 400 --json examples/access.log
      - name: Run health gate
        run: moon run cmd/main -- --max-error-rate 100 examples/access.log
      - name: Run UTC hour filter
        run: moon run cmd/main -- --hour-prefix 23/Sep/2026:09 --json examples/access.log
      - name: Build native binary
        run: moon build --target native
