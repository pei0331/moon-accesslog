name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install MoonBit
        run: |
          set -euxo pipefail
          curl --ipv4 --fail --location --silent --show-error \
            --connect-timeout 20 --max-time 120 \
            --retry 8 --retry-delay 3 --retry-all-errors \
            https://cli.moonbitlang.com/install/unix.sh -o install.sh
          bash install.sh
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
      - name: Check formatting
        run: moon fmt --check
      - name: Type check
        run: moon check
      - name: Run tests
        run: moon test
      - name: Run CLI example
        run: moon run cmd/main -- examples/access.log
      - name: Build native target
        run: moon build --target native
